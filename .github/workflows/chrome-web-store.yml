name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag; leave blank to build the selected branch"
        required: false
        type: string
      publish:
        description: "Submit for review and publish after approval"
        default: false
        type: boolean

permissions:
  contents: read
env:
  HUSKY: "0"

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun scripts/package.js
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Check out the uploader from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .publisher
          sparse-checkout: scripts/chrome-web-store.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Upload package and optionally submit for review
        run: bun .publisher/scripts/chrome-web-store.js
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH: ${{ inputs.publish }}
