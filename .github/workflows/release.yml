name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write
env:
  HUSKY: "0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # An outdated snapshot still ships; the weekly refresh pull request brings it up to date.
      - name: Check whether the bang catalog is current
        if: ${{ hashFiles('src/data/bangs.json') != '' }}
        run: |
          if ! bun run bangs:refresh --check; then
            echo "::warning title=Bang catalog::The committed bang catalog is outdated or could not be checked. This build uses the committed snapshot; merge the refresh pull request before the next release."
          fi

      - run: bun run check

      - run: bun scripts/package.js
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Helium New Tab $RELEASE_TAG" --generate-notes
