version: 2

updates:
  # Workflows use major version tags; Dependabot proposes new major versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The bun ecosystem is disabled until Dependabot can read the lockfileVersion 2 bun.lock
  # that Bun 1.4 writes: https://github.com/dependabot/dependabot-core/issues/16026
